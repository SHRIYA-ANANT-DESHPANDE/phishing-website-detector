[project]
name = "phishing-link-detector-api"
version = "0.1.0"
description = "Backend API for phishing URL detection"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "scikit-learn>=1.5,<2.0",
  "joblib>=1.4,<2.0",
  "requests>=2.31,<3.0",
  "beautifulsoup4>=4.12,<5.0",
]

[tool.uvicorn]
factory = false
