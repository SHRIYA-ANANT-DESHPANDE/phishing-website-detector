<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Check if a URL is a phishing link using AI-powered detection">
    <title>Phishing Link Detector</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔒 Phishing Link Detector</h1>
            <p class="subtitle">AI-powered URL safety checker</p>
        </header>

        <main>
            <!-- Backend Status -->
            <div id="backendStatus" class="status-banner" role="status" aria-live="polite">
                <span id="statusText">Checking backend connection...</span>
            </div>

            <!-- URL Input Form -->
            <form id="checkForm" class="check-form" novalidate>
                <div class="form-group">
                    <label for="urlInput">Enter URL to check:</label>
                    <div class="input-wrapper">
                        <input 
                            type="url" 
                            id="urlInput" 
                            name="url"
                            placeholder="https://example.com"
                            required
                            aria-describedby="urlHelp urlError"
                            autocomplete="url"
                        >
                        <button 
                            type="submit" 
                            id="checkButton"
                            class="btn btn-primary"
                            aria-label="Check URL for phishing"
                        >
                            <span class="btn-text">Check URL</span>
                            <span class="spinner" aria-hidden="true"></span>
                        </button>
                    </div>
                    <small id="urlHelp" class="form-text">Enter a complete HTTP or HTTPS URL</small>
                    <div id="urlError" class="error-message" role="alert" aria-live="assertive"></div>
                </div>
            </form>

            <!-- Results Display -->
            <div id="resultsContainer" class="results-container" style="display: none;">
                <div id="resultCard" class="result-card">
                    <div class="result-header">
                        <span class="result-icon" aria-hidden="true"></span>
                        <h2 class="result-title"></h2>
                    </div>
                    
                    <div class="result-details">
                        <div class="detail-item">
                            <strong>URL:</strong>
                            <span id="resultUrl" class="url-display"></span>
                        </div>
                        
                        <div class="detail-item">
                            <strong>Prediction:</strong>
                            <span id="resultPrediction"></span>
                        </div>
                        
                        <div class="detail-item" id="confidenceContainer" style="display: none;">
                            <strong>Confidence:</strong>
                            <div class="confidence-bar">
                                <div id="confidenceProgress" class="confidence-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                            <span id="resultConfidence"></span>
                        </div>
                    </div>

                    <div class="result-message">
                        <p id="resultDescription"></p>
                    </div>
                </div>
            </div>

            <!-- Error Display -->
            <div id="errorContainer" class="error-container" style="display: none;" role="alert">
                <div class="error-card">
                    <h3>⚠️ Error</h3>
                    <p id="errorMessage"></p>
                </div>
            </div>
        </main>

        <footer>
            <p>
                <small>
                    This tool uses machine learning to detect phishing URLs. 
                    Always verify suspicious links through multiple sources.
                </small>
            </p>
        </footer>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
